name: Workflow Statistics

on:
  push:
  pull_request:

jobs:
  count-workflows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Count workflow files
        run: |
          count=$(find .github/workflows -type f -name "*.yml" -o -name "*.yaml" | wc -l)

          echo "Number of workflow files: $count"